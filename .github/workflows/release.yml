name: Release

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.26.1"

      - name: Get tag version
        id: tag
        run: echo "version=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Run tests
        run: go test -v ./...

      - name: Build application for Linux
        run: |
          CGO_ENABLED=1 go build \
            -ldflags "-X main.version=${{ steps.tag.outputs.version }} -X main.buildTime=$(date -u +"%Y-%m-%dT%H:%M:%SZ") -X main.appName=go-api-template" \
            -o build/go-api-template-linux-amd64 cmd/main.go

      - name: Build application for macOS
        run: |
          GOOS=darwin GOARCH=amd64 CGO_ENABLED=0 go build \
            -ldflags "-X main.version=${{ steps.tag.outputs.version }} -X main.buildTime=$(date -u +"%Y-%m-%dT%H:%M:%SZ") -X main.appName=go-api-template" \
            -o build/go-api-template-darwin-amd64 cmd/main.go

      - name: Build application for Windows
        run: |
          GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build \
            -ldflags "-X main.version=${{ steps.tag.outputs.version }} -X main.buildTime=$(date -u +"%Y-%m-%dT%H:%M:%SZ") -X main.appName=go-api-template" \
            -o build/go-api-template-windows-amd64.exe cmd/main.go

      - name: Create Release
        if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v1
        with:
          tag_name: ${{ steps.tag.outputs.version }}
          files: |
            build/go-api-template-linux-amd64
            build/go-api-template-darwin-amd64
            build/go-api-template-windows-amd64.exe
          draft: false
          prerelease: false
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
