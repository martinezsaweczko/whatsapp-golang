name: CI - Build & Test

on:
  push:
    branches:
      - main
      - develop
  pull_request:
    branches:
      - main
      - develop

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: "1.27.0"

      - name: Run go vet
        run: go vet ./...

      - name: Run go fmt check
        run: |
          gofmt -l .
          if [ $(gofmt -l . | wc -l) -gt 0 ]; then
            echo "Some files are not formatted. Run 'go fmt ./...'"
            exit 1
          fi

      - name: Run vulnerability check
        run: go install golang.org/x/vuln/cmd/govulncheck@latest && govulncheck ./...

      - name: Verify go.mod tidiness
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum || (echo "go.mod or go.sum is not tidy" && exit 1)

      - name: Install swag
        run: go install github.com/swaggo/swag/cmd/swag@latest

      - name: Verify Swagger docs are up to date
        run: make check-swagger

      - name: Build application
        run: go build -o build/main cmd/main.go

      - name: Run tests
        run: go test -race -count=1 ./...

      - name: Verify container build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Containerfile
          push: false
          tags: whatsappbot-golang:ci
